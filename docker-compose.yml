version: '3.8'

services:
  backend:
    build: ./backend
    container_name: freestyle-wm-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    env_file:
      - incoming.env
    environment:
      - FLASK_ENV=development
      - APP_DATA_DIR=/app/data
      - DATABASE_BACKEND=${DATABASE_BACKEND:-sqlite}
      - DATABASE_PATH=/app/data/freestyle_wm_new.db
      - DATABASE_URL=${DATABASE_URL:-postgresql://incoming:change-me@postgres:5432/incoming}
    networks:
      - freestyle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: freestyle-wm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incoming}
      POSTGRES_USER: ${POSTGRES_USER:-incoming}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - freestyle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: freestyle-wm-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      - VITE_API_URL=https://incoming.jokley.at/api
    depends_on:
      - backend
    networks:
      - freestyle-network
    restart: unless-stopped

networks:
  freestyle-network:
    driver: bridge

volumes:
  backend-data:
  postgres-data:
