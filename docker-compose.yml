version: '3.8'

services:
  backend:
    build: ./backend
    container_name: freestyle-wm-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    env_file:
      - incoming.env
    environment:
      - FLASK_ENV=development
      - APP_DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/freestyle_wm_new.db
    networks:
      - freestyle-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: freestyle-wm-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      - VITE_API_URL=https://incoming.jokley.at/api
    depends_on:
      - backend
    networks:
      - freestyle-network
    restart: unless-stopped

networks:
  freestyle-network:
    driver: bridge

volumes:
  backend-data:
