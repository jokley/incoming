version: '3.8'

services:
  backend:
    build: ./backend
    container_name: freestyle-wm-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - postgres-backups:/backups:ro
    env_file:
      - incoming.env
    networks:
      - freestyle-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    container_name: freestyle-wm-postgres
    env_file:
      - incoming.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - freestyle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    container_name: freestyle-wm-backup
    env_file:
      - incoming.env
    volumes:
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freestyle-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Manually invoked one-shot tool; never starts with the normal application.
  etl:
    profiles: ["etl"]
    build: ./backend
    env_file:
      - incoming.env
    volumes:
      - ./backend:/app:ro
      # Override SQLITE_SNAPSHOT_PATH with the reviewed snapshot's absolute
      # host path. The fallback is a staging location, never the runtime DB.
      - ${SQLITE_SNAPSHOT_PATH:-./migration-snapshots/source.db}:/snapshot/source.db:ro
      - ./migration-reports:/reports
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freestyle-network
    restart: "no"
    entrypoint: ["python", "-m", "etl.sqlite_to_postgres"]
    command: ["--help"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: freestyle-wm-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    environment:
      - VITE_API_URL=https://incoming.jokley.at/api
    depends_on:
      - backend
    networks:
      - freestyle-network
    restart: unless-stopped

networks:
  freestyle-network:
    driver: bridge

volumes:
  postgres-data:
  postgres-backups:
