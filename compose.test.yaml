name: incoming-tests
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incoming_test
      POSTGRES_USER: incoming_test
      POSTGRES_PASSWORD: incoming_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incoming_test -d incoming_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  test-postgres-data:
